<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilas de Fora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;700&family=Noto+Sans+Devanagari:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: um álbum de moedas. Cada país é um encaixe: cheio (metal) quando está na coleção, tracejado quando falta. */
:root {
  --bg: #121315;
  --surface: #1b1d20;
  --line: #2e3135;
  --text: #ece9e3;
  --muted: #9a978f;
  --brass: #c9a25e;
  --brass-deep: #8a6a33;
  --silver: #c7ccd1;
  --copper: #b8734a;
  --display: "Sora", "Noto Sans SC", "Noto Sans Devanagari", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Instrument Sans", "Noto Sans SC", "Noto Sans Devanagari", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
html[lang^="zh"] body *, html[lang="hi"] body * { letter-spacing: 0 !important; }
html[lang="hi"] body { line-height: 1.7; }
a { color: var(--brass); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* Cabeçalho */
header.top { border-bottom: 1px solid var(--line); }
header.top .wrap { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "logo redes langs" "nav nav langs"; align-items: start; gap: 8px 16px; padding-top: 16px; padding-bottom: 20px; }
.logo { grid-area: logo; justify-self: start; font-family: "Sora", "Avenir Next", "Segoe UI", sans-serif; font-weight: 700; font-size: clamp(42px, 6.8vw, 76px); letter-spacing: -0.02em; text-decoration: none; display: inline-flex; align-items: baseline; }
.logo .pilas { color: var(--brass); }
.logo .defora { color: var(--text); display: inline-flex; align-items: baseline; }
.logo svg { color: var(--brass); width: 0.62em; height: 0.62em; margin: 0 0.02em; transform: translateY(0.02em); }
.nets.nets-topo { grid-area: redes; align-self: center; justify-self: start; display: grid; grid-template-columns: repeat(2, auto); gap: 10px 12px; margin-left: 10px; }
.nets.nets-topo .net svg { width: 24px; height: 24px; }
.nets-topo .net .sem-icone { font-size: 16px; }
@media (max-width: 520px) {
  header.top .wrap { grid-template-columns: 1fr auto; grid-template-areas: "logo langs" "redes langs" "nav langs"; }
  .nets.nets-topo { grid-template-columns: repeat(4, auto); gap: 16px; margin: 2px 0 0; align-self: start; }
  .nets.nets-topo .net svg { width: 22px; height: 22px; }
}
.langs { grid-area: langs; display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.langs button { min-width: 64px; text-align: center; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.langs button:hover { color: var(--text); border-color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--brass); color: #1a1407; border-color: var(--brass); }
nav.top { grid-area: nav; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 28px; margin-top: 8px; }
nav.top a { color: var(--muted); text-decoration: none; font-family: var(--display); font-weight: 300; font-size: clamp(22px, 2.8vw, 32px); letter-spacing: -0.02em; line-height: 1.2; padding-bottom: 6px; border-bottom: 2px solid transparent; }
nav.top a:hover { color: var(--text); }
nav.top a[aria-current="page"] { color: var(--text); font-weight: 600; border-bottom-color: var(--brass); }
/* Abas: só a parte escolhida no menu aparece */
.aba[hidden] { display: none !important; }

/* Abertura */
.hero { padding: 40px 0 32px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1.75fr 1fr; gap: 32px; align-items: end; }
.hero h1 { font-family: var(--display); font-weight: 300; font-size: clamp(34px, 5.4vw, 60px); line-height: 1.08; letter-spacing: -0.035em; margin: 0 0 16px; text-wrap: balance; }
.hero h1 strong { font-weight: 800; color: var(--brass); white-space: nowrap; }
.hero p { color: var(--muted); max-width: 52ch; margin: 0; }
.tally { border: 1px solid var(--line); border-radius: 14px; padding: 20px; background: var(--surface); }
.tally .num { font-family: "Sora", sans-serif; font-weight: 800; font-size: 56px; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.tally .num span { color: var(--muted); font-weight: 300; }
.tally .lbl { color: var(--muted); margin: 6px 0 14px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .b-temos { background: var(--brass); }
.bar .b-ganhamos { background: var(--silver); }
.legend { display: flex; gap: 8px 16px; margin-top: 12px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.legend b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* Redes */
.social { padding: 40px 0 40px; }
.social h2, .send h2 { font-family: var(--display); font-weight: 300; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 24px; text-wrap: balance; }
.social h2 strong, .send h2 strong { font-weight: 800; color: var(--brass); }
.nets { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.net { color: var(--brass); display: inline-flex; line-height: 0; transition: color .15s, transform .15s; }
.net svg { width: 28px; height: 28px; }
a.net:hover { color: #e3c07f; transform: translateY(-2px); }
.net.soon { cursor: default; }
.net .sem-icone { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.2; }
@media (prefers-reduced-motion: reduce) { a.net:hover { transform: none; } }

/* o título fica em linha para a setinha cair logo depois da última palavra */
.sec-head { margin-bottom: 24px; }
.sec-head h2 { display: inline; margin: 0 !important; }
.topo { display: inline-grid; place-items: center; vertical-align: middle; position: relative; top: -0.15em; margin-left: 14px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--brass); background: transparent; color: var(--brass); cursor: pointer; padding: 0; transition: background .15s, color .15s; }
.topo svg { width: 20px; height: 20px; }
.fim-secao { display: flex; justify-content: center; margin: 32px 0 8px; }
.fim-secao .topo { margin-left: 0; top: 0; }
.send .fim-secao { grid-column: 1 / -1; margin-top: 0; }
.topo:hover { background: var(--brass); color: #1a1407; }

/* Filtros */
.tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 12px 0 20px; position: sticky; top: 0; background: var(--bg); z-index: 5; border-bottom: 1px solid var(--line); }
.search { flex: 1 1 220px; display: flex; }
.search input { width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px 14px; font: inherit; }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 7px 13px; font: inherit; font-size: 14px; cursor: pointer; }
.chip:hover { color: var(--text); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }

/* Grade de países (encaixes do álbum) */
.continent h2 { font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; margin: 32px 0 14px; display: flex; gap: 10px; align-items: baseline; }
.continent h2 small { font-family: var(--body); font-weight: 400; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.slot { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--text); font: inherit; cursor: pointer; transition: border-color .15s, transform .15s; }
.slot:hover { border-color: var(--muted); transform: translateY(-1px); }
.slot .ring { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; border: 2px dashed var(--line); }
.slot.has .ring { border: 0; }
.slot.has .ring { background: radial-gradient(circle at 35% 30%, #f3dca6, var(--brass) 45%, var(--brass-deep)); position: relative; }
.slot .badge { position: absolute; right: -6px; bottom: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: var(--text); color: var(--bg); font-size: 11px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.slot .nm { font-weight: 600; font-size: 14px; line-height: 1.25; }
.slot .cur { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.slot.missing .nm { color: #cfccc5; }
.empty { color: var(--muted); padding: 40px 0; }

/* Painel do país */
.overlay { position: fixed; inset: 0; background: rgba(8, 9, 10, .72); display: none; align-items: flex-start; justify-content: center; padding: 24px 16px; overflow-y: auto; z-index: 20; }
.overlay.open { display: flex; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; width: 100%; max-width: 860px; padding: 24px; position: relative; }
.close { position: absolute; top: 14px; right: 14px; background: transparent; border: 1px solid var(--line); color: var(--text); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.p-head { display: flex; gap: 16px; align-items: center; padding-right: 44px; }
.p-head .flag { line-height: 0; }
.p-head .flag img { width: 54px; height: 36px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
.bandeira { display: block; }
.slot .ring .bandeira { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
.bandeira.mini { display: inline-block; width: 21px; height: 14px; border-radius: 2px; vertical-align: -2px; box-shadow: 0 0 0 1px rgba(255,255,255,.15); }
.p-head h3 { font-family: var(--display); font-weight: 700; font-size: 28px; letter-spacing: -0.02em; margin: 0; }
.p-head .meta { color: var(--muted); font-size: 14px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; margin-left: 8px; vertical-align: 3px; }
.pill.temos { background: var(--brass); color: #1a1407; }
.pill.ganhamos { background: var(--silver); color: #15181b; }
.pill.missing { border: 1px dashed var(--muted); color: var(--muted); }
.pill.exemplo { background: transparent; border: 1px solid var(--copper); color: var(--copper); }

.tray { margin: 24px 0 8px; padding: 24px 16px 16px; border-radius: 14px; background: #0d0e10; border: 1px solid var(--line); overflow-x: auto; }
.timeline { display: flex; align-items: stretch; min-width: min-content; }
.era { display: flex; flex-direction: column; padding: 0 14px; }
.era .year { margin-top: auto; }
.era .coins { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
.coin-box { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }
.year { position: relative; border-top: 2px solid var(--line); margin: 14px -14px 0; padding: 10px 14px 0; font-family: "Sora", sans-serif; font-weight: 700; font-size: 15px; color: var(--brass); font-variant-numeric: tabular-nums; }
.year::before { content: ""; position: absolute; left: 14px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--brass); }
.tag { font-size: 11px; color: var(--muted); white-space: nowrap; }
.tag.gift { color: var(--silver); border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px; white-space: normal; text-align: center; max-width: 140px; }
.tag.special { color: var(--copper); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.coin-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; }
.coin-cell .coin { margin-bottom: 4px; }
.coin { position: relative; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
.coin .face { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.coin.quadrada .face { border-radius: 10%; }
.coin.poligono .face { border-radius: 0; box-shadow: none; }
.coin.foto { filter: none; perspective: 700px; }
.coin.flip { cursor: pointer; }
.coin.foto .lados { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,.7,.3,1); }
.coin.foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; backface-visibility: hidden; -webkit-backface-visibility: hidden; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
.coin.foto .verso { transform: rotateY(180deg); }
.coin.flip:hover .lados, .coin.flip:focus-visible .lados, .coin.flip.virada .lados { transform: rotateY(180deg); }
.coin.flip:focus-visible { outline-offset: 4px; border-radius: 50%; }
@media (prefers-reduced-motion: reduce) { .coin.foto .lados { transition: none; } }
.coin .hole { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; background: #0d0e10; box-shadow: inset 0 1px 2px rgba(0,0,0,.8); }
.coin .core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.coin-cell .v { font-weight: 600; font-size: 13px; white-space: nowrap; }
.coin-cell .mm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.calib-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--brass); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.calib { display: none; margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
.calib.open { display: block; }
.calib p { margin: 0 0 12px; font-size: 14px; color: var(--muted); max-width: 60ch; }
.card-outline { border: 2px solid var(--brass); border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.calib input[type=range] { width: 100%; accent-color: var(--brass); }
.calib .row { display: flex; gap: 12px; align-items: center; margin-top: 8px; }

.textos { display: grid; gap: 14px; margin: 22px 0 0; max-width: 70ch; }
.txt h4 { margin: 0 0 4px; font-family: var(--display); font-weight: 600; font-size: 16px; }
.txt h4 .ano { color: var(--brass); font-variant-numeric: tabular-nums; margin-left: 4px; }
.txt p { margin: 0; white-space: pre-line; }
.credit { margin: 16px 0 0; color: var(--muted); font-size: 14px; }
.credit b { color: var(--text); font-weight: 600; }
.buy { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.btn { display: inline-block; background: var(--brass); color: #1a1407; text-decoration: none; padding: 11px 18px; border-radius: 10px; border: 0; font: inherit; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .5; cursor: default; filter: none; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.buy small { color: var(--muted); font-size: 12px; max-width: 60ch; }

.want { margin: 28px 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
.want .slots { display: flex; gap: 10px; align-items: flex-end; }
.want .slots i { width: 44px; height: 44px; border-radius: 50%; border: 2px dashed var(--line); display: block; }
.want .slots i:nth-child(2) { width: 54px; height: 54px; }
.want .slots i:nth-child(3) { width: 38px; height: 38px; }
.want p { margin: 0 0 12px; }


/* Apoie */
.apoie { padding: 40px 0 24px; }
.apoie h2 { font-family: var(--display); font-weight: 300; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; letter-spacing: -0.03em; text-wrap: balance; }
.apoie h2 strong { font-weight: 800; color: var(--brass); }
.ap-top { display: grid; grid-template-columns: 1fr; gap: 32px; align-items: start; }
.ap-top.com-video { grid-template-columns: 1.25fr 1fr; }
.ap-top.com-video.vertical { grid-template-columns: 1fr 300px; }
.ap-lead { font-size: 19px; line-height: 1.55; max-width: 62ch; margin: 0 0 24px; }
.pilares { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pilar { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.pilar h4 { margin: 0 0 6px; font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--brass); }
.pilar p { margin: 0; color: var(--muted); font-size: 14px; }
.ap-video { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #0d0e10; aspect-ratio: 16 / 9; }
.ap-video.vertical { aspect-ratio: 9 / 16; }
.ap-video iframe { width: 100%; height: 100%; border: 0; display: block; }
.ap-status { margin: 24px 0 0; color: var(--muted); font-size: 14px; border-left: 2px solid var(--copper); padding-left: 12px; max-width: 75ch; }
.ap-h3 { font-family: var(--display); font-weight: 600; font-size: 24px; letter-spacing: -0.01em; margin: 48px 0 6px; }
.ap-sub { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.formas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.forma { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.forma h4 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
.forma p { margin: 0; color: var(--muted); }
.forma .acoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: auto; }
.pix { width: 100%; }
.pix .tag { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
.pix code { display: block; font-family: var(--body); font-size: 17px; color: var(--text); word-break: break-all; margin-bottom: 10px; }
.niveis { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.nivel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.nivel.topo-nivel { border-color: var(--brass-deep); }
.nivel .metal { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nivel .metal i { width: 34px; height: 34px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 4px rgba(0,0,0,.5); }
.nivel h4 { margin: 4px 0 0; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.nivel .desc { margin: 0; color: var(--muted); font-size: 14px; }
.nivel .preco { margin: 0; color: var(--brass); font-weight: 600; font-variant-numeric: tabular-nums; }
.nivel ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.nivel li { padding-left: 18px; position: relative; }
.nivel li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 7px; height: 7px; border-radius: 50%; background: var(--brass); }
.mantenedores { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 0; padding: 0; list-style: none; font-family: var(--display); font-weight: 600; font-size: 18px; }
.mantenedores a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--brass-deep); }
.contato { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.contato .btn svg, .btn .ico { width: 18px; height: 18px; vertical-align: -3px; margin-right: 8px; }
.contato-redes { margin: 0; color: var(--muted); }
.pdf-row { margin-top: 18px; }
.fale { padding: 0 0 24px; }
.fale .ap-h3 { margin-top: 8px; }

/* Links e patrocínio por moeda */
.txt-links { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; }
.txt-links a.mais { font-size: 14px; text-underline-offset: 3px; }
.btn.sm { padding: 7px 13px; font-size: 14px; border-radius: 8px; }
.patro { display: inline-block; margin-left: 8px; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--silver); border: 1px solid var(--line); border-radius: 99px; padding: 1px 9px; vertical-align: 2px; }
.patro a { color: var(--silver); }
.set-patro { margin-top: 4px; color: var(--silver); font-size: 14px; }
.set-patro a { color: var(--silver); }

/* Envie */
.send { padding: 40px 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.send ol { padding-left: 20px; margin: 0; display: grid; gap: 12px; }
.send ol li::marker { color: var(--brass); font-family: "Sora", sans-serif; font-weight: 700; }
.address { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; align-self: start; }
.address .tag { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
.address address { font-style: normal; font-size: 18px; line-height: 1.55; font-variant-numeric: tabular-nums; margin-bottom: 16px; }
.address .note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
.copied { color: var(--brass); font-size: 13px; margin-left: 10px; }

/* Ranking */
.ranking { padding: 40px 0 24px; }
.ranking h2 { font-family: var(--display); font-weight: 300; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 24px; text-wrap: balance; }
.ranking h2 strong { font-weight: 800; color: var(--brass); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: 16px; padding: 10px 16px; cursor: pointer; margin-bottom: -1px; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--brass); }
.rank { list-style: none; margin: 0; padding: 0; max-width: 720px; }
.rank li { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rank li.head { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 8px 0; }
.rank li.dois { grid-template-columns: 40px 1fr auto; }
.rank .pos { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: "Sora", sans-serif; font-weight: 700; font-size: 14px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.rank li:nth-child(2) .pos { background: radial-gradient(circle at 35% 30%, #f6e2a8, #c9a25e 48%, #7d5f2c); color: #1a1407; border: 0; }
.rank li:nth-child(3) .pos { background: radial-gradient(circle at 35% 30%, #ffffff, #c7ccd1 46%, #737a81); color: #15181b; border: 0; }
.rank li:nth-child(4) .pos { background: radial-gradient(circle at 35% 30%, #f0b48c, #b8734a 48%, #6e3d22); color: #1a0e07; border: 0; }
.rank .quem { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rank .nome { font-weight: 600; }
.rank .nac { color: var(--muted); font-size: 13px; }
.rank .num { font-variant-numeric: tabular-nums; text-align: right; min-width: 64px; }
.rank-extra, .rank-vazio { color: var(--muted); padding: 14px 0; margin: 0; }
.rank-nota { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
.acervo { list-style: none; margin: 0; padding: 0; max-width: 720px; }
.acervo li { display: grid; grid-template-columns: 1fr 1.2fr 56px 1.4fr; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.acervo li.head { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 8px 0; }
.acervo .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.acervo .anon { color: var(--muted); font-style: italic; }
@media (max-width: 480px) { .acervo li { grid-template-columns: 1fr 1fr 44px 1fr; font-size: 13px; gap: 8px; } }
.acervo .val { font-weight: 600; }

footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding: 20px 0 40px; margin-top: 40px; }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; gap: 24px; padding-top: 32px; }
  .send { grid-template-columns: 1fr; }
  .ap-top.com-video, .ap-top.com-video.vertical, .pilares, .formas { grid-template-columns: 1fr; }
  .ap-video.vertical { max-width: 300px; }
  .want { grid-template-columns: 1fr; }
  .panel { padding: 20px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .slot { transition: none; }
  .slot:hover { transform: none; }
}

const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let pxPorMm = parseFloat(store.get("pdf-pxmm")) || (96 / 25.4);

function idiomaInicial() {
  const salvo = store.get("pdf-lang");
  if (salvo && T[salvo]) return salvo;
  const prefs = (navigator.languages || [navigator.language || "pt"]).map(l => String(l).toLowerCase().slice(0, 2));
  return prefs.find(l => T[l]) || "pt";
}
const estado = { q: "", st: "todos", cont: "Todos", lang: idiomaInicial() };

const t = (k, vars) => {
  let s = (T[estado.lang] && T[estado.lang][k] !== undefined) ? T[estado.lang][k] : T.pt[k];
  if (vars) Object.keys(vars).forEach(v => { s = s.split("{" + v + "}").join(vars[v]); });
  return s;
};
const tr = v => (v && typeof v === "object") ? (v[estado.lang] || v.pt || "") : (v || "");
const locale = () => IDIOMAS.find(i => i.id === estado.lang).locale;

let nomesRegiao = null;
function nomePais(p) {
  if (estado.lang === "pt") return p.nome;
  try {
    if (!nomesRegiao || nomesRegiao.lang !== estado.lang) nomesRegiao = { lang: estado.lang, dn: new Intl.DisplayNames([locale()], { type: "region" }) };
    return nomesRegiao.dn.of(p.cc) || p.nome;
  } catch (e) { return p.nome; }
}
/* Bandeiras em arquivo (pasta bandeiras/), porque o Windows não mostra emoji de bandeira. */

function textosFixos() {
  document.documentElement.lang = locale();

    return r.url
      ? '<a class="net" href="' + esc(r.url) + '" target="_blank" rel="noopener" aria-label="' + rotulo + '" title="' + rotulo + '">' + icone + '</a>'

  }).join("");
  document.getElementById("nets").innerHTML = htmlRedes;
  document.getElementById("nets-topo").innerHTML = htmlRedes;
}

function contagem() {
  const total = PAISES.length;
  const com = PAISES.filter(p => p.set).length;
  const todas = PAISES.flatMap(p => p.set ? p.set.moedas : []);
  document.getElementById("t-num").innerHTML = com + "<span> / " + total + "</span>";
  document.getElementById("t-moedas").textContent = todas.length;
  document.getElementById("t-compradas").textContent = todas.filter(m => m.origem !== "ganhamos").length;
  document.getElementById("t-presentes").textContent = todas.filter(m => m.origem === "ganhamos").length;
  document.querySelector("#t-bar i").style.width = (com / total * 100) + "%";
}

function chipsContinente() {

}

function lista() {
  const q = norm(estado.q.trim());
  const loc = locale();
  const filtrados = PAISES.filter(p =>
    (estado.cont === "Todos" || p.cont === estado.cont) &&
    (estado.st === "todos" || (estado.st === "tem" ? !!p.set : !p.set)) &&
    (!q || norm(nomePais(p)).includes(q) || norm(p.nome).includes(q) || norm(p.moeda).includes(q)))
    .sort((a, b) => nomePais(a).localeCompare(nomePais(b), loc));
  const out = document.getElementById("lista");
  if (!filtrados.length) { out.innerHTML = '<p class="empty">' + t("vazio") + '</p>'; return; }
  out.innerHTML = CONTINENTES.map(c => {
    const ps = filtrados.filter(p => p.cont === c);
    if (!ps.length) return "";
    const tot = PAISES.filter(p => p.cont === c);
    const tem = tot.filter(p => p.set).length;
    return '<section class="continent"><h2>' + nomeCont(c) + ' <small>' + t("conta", { a: tem, b: tot.length }) + '</small></h2><div class="grid">' +
      ps.map(p => {
        const cls = p.set ? "has" : "missing";
        const nome = nomePais(p);
        return '<button class="slot ' + cls + '" data-slug="' + p.slug + '" aria-label="' + esc(nome) + ", " + (p.set ? qtd(p.set.moedas.length) : t("aria_falta")) + '">' +
          '<span class="ring" aria-hidden="true">' + bandeira(p) + (p.set ? '<span class="badge">' + p.set.moedas.length + '</span>' : '') + '</span>' +
          '<span><span class="nm">' + esc(nome) + '</span><br><span class="cur">' + esc(p.moeda) + '</span></span></button>';
      }).join("") + '</div></section>';
  }).join("");
}

const fmtMm = n => n.toLocaleString(locale(), { maximumFractionDigits: 2 });

/* Polígono regular com uma ponta para cima, ocupando a largura indicada em mm (de ponta a ponta). */
function poligono(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    pts.push((50 + 50 * Math.cos(a)).toFixed(2) + "% " + (50 + 50 * Math.sin(a)).toFixed(2) + "%");
  }
  return "polygon(" + pts.join(", ") + ")";
}

  const d = m.mm * pxPorMm;
  let inner = "";
  if (m.nucleo) { const n = d * 0.68; inner += '<span class="core" style="width:' + n + 'px;height:' + n + 'px;background:' + METAIS[m.nucleo] + '"></span>'; }
  if (m.furo) { const f = m.furo * pxPorMm; inner += '<span class="hole" style="width:' + f + 'px;height:' + f + 'px"></span>'; }
  const pd = m.presenteDe || {};
  const origem = m.origem === "ganhamos"
    ? '<div class="tag gift">' + (pd.autorizou && pd.nome ? t("tag_presente_de", { nome: esc(pd.nome) }) : t("tag_presente")) + '</div>'
    : '<div class="tag">' + t("tag_comprada") + '</div>';
  const valor = esc(tr(m.valor));
  const foto = m.foto || {};
  let moeda;
  if (foto.frente) {
    moeda = '<div class="coin foto' + (foto.verso ? ' flip" tabindex="0" role="button" aria-label="' + valor + ' – ' + t("dica_verso") + '"' : '"') +
      ' style="width:' + d + 'px;height:' + d + 'px"><div class="lados"><img class="frente" src="' + esc(foto.frente) + '" alt="' + valor + '">' +
      (foto.verso ? '<img class="verso" src="' + esc(foto.verso) + '" alt="">' : '') + '</div></div>';
  } else {
    const forma = m.formato === "quadrada" ? " quadrada" : (m.formato === "poligono" && m.lados >= 3 ? " poligono" : "");
    const recorte = forma === " poligono" ? "clip-path:" + poligono(m.lados) + ";" : "";
    moeda = '<div class="coin' + forma + '" style="width:' + d + 'px;height:' + d + 'px"><div class="face" style="' + recorte + 'background:' + (METAIS[m.metal] || METAIS.prata) + '">' + inner + '</div></div>';
  }
  return '<div class="coin-cell"><div class="coin-box" style="height:' + alturaBox + 'px">' + (m.especial ? '<div class="tag special">' + t("pill_especial") + '</div>' : '') +
    moeda + '</div><div class="v">' + valor + '</div>' +
    '<div class="mm">' + fmtMm(m.mm) + ' ' + t("mm") + '</div>' + origem + '</div>';
}

function linhaDoTempo(moedas) {
  const grupos = [];
  const alturaBox = Math.max.apply(null, moedas.map(m => m.mm)) * pxPorMm + 26;
  ordenar(moedas).forEach(m => {
    const g = grupos[grupos.length - 1];
    if (g && g.ano === m.ano) g.moedas.push(m); else grupos.push({ ano: m.ano, moedas: [m] });
  });
  return '<div class="timeline">' + grupos.map(g =>
    '<div class="era"><div class="coins">' + g.moedas.map(m => moedaHTML(m, alturaBox)).join("") + '</div><div class="year">' + g.ano + '</div></div>').join("") + '</div>';
}

function painel(p) {
  const s = p.set;
  const nome = nomePais(p);
  let meta = nomeCont(p.cont) + ' · ' + esc(p.moeda);
  if (s) {
    const anos = s.moedas.map(m => m.ano);
    const a = Math.min.apply(null, anos), b = Math.max.apply(null, anos);
    meta += ' · ' + qtd(s.moedas.length) + ', ' + (a === b ? a : t("periodo", { a: a, b: b }));
  }
  let h = '<button class="close" id="fechar" aria-label="' + t("fechar") + '">✕</button>' +
    '<div class="p-head"><span class="flag" aria-hidden="true">' + bandeira(p) + '</span><div>' +
    '<h3 id="p-title">' + esc(nome) +
    (s ? '' : '<span class="pill missing">' + t("pill_falta") + '</span>') +
    (s && s.exemplo ? '<span class="pill exemplo">' + t("pill_exemplo") + '</span>' : "") + '</h3>' +
    '<div class="meta">' + meta + '</div>' +
    (s && s.patrocinio && s.patrocinio.nome ? '<div class="set-patro">' + t("set_patrocinio", { nome: nomeLink(s.patrocinio) }) + '</div>' : '') +
    '</div></div>';

  if (s) {
    h += '<div class="tray" id="coins">' + linhaDoTempo(s.moedas) + '</div>' +
      '<div class="calib-row"><span>' + t("tamanho_real") + (s.moedas.some(m => m.foto && m.foto.frente && m.foto.verso) ? ' ' + t("dica_verso") : '') + '</span><button class="linkbtn" id="abrir-calib" type="button">' + t("ajustar") + '</button></div>' +
      '<div class="calib" id="calib"><p>' + t("calib_p") + '</p>' +
      '<div class="card-outline" id="card" aria-hidden="true">' + t("cartao", { mm: fmtMm(CARTAO_MM) }) + '</div>' +
      '<label for="escala" class="row"><input id="escala" type="range" min="2" max="9" step="0.01" value="' + pxPorMm + '" aria-label="' + t("ajustar") + '"></label>' +
      '<div class="row"><button class="btn ghost" id="reset-calib" type="button">' + t("padrao") + '</button></div></div>';
    const urlCompra = m => (m.compra && m.compra.url) || "";
    const comTexto = ordenar(s.moedas).filter(m => tr(m.texto) || tr(m.link) || urlCompra(m) || (m.patrocinio && m.patrocinio.nome));
    if (comTexto.length) {
      h += '<div class="textos">' + comTexto.map(m => {
        const links = (tr(m.link) ? '<a class="mais" href="' + esc(tr(m.link)) + '" target="_blank" rel="noopener">' + t("moeda_link") + ' ↗</a>' : '') +
          (urlCompra(m) ? '<a class="btn sm" href="' + esc(urlCompra(m)) + '" target="_blank" rel="noopener sponsored">' + t("moeda_comprar") + '</a>' : '');
        return '<article class="txt"><h4>' + esc(tr(m.valor)) + ' <span class="ano">' + m.ano + '</span>' +
          (m.especial ? ' <span class="tag special">' + t("pill_especial") + '</span>' : '') +
          (m.patrocinio && m.patrocinio.nome ? ' <span class="patro">' + t("patrocinada", { nome: nomeLink(m.patrocinio) }) + '</span>' : '') + '</h4>' +
          (tr(m.texto) ? '<p>' + esc(tr(m.texto)) + '</p>' : '') +
          (links ? '<div class="txt-links">' + links + '</div>' : '') + '</article>';
      }).join("") + '</div>';
    }
    const algumaMoeda = s.moedas.some(urlCompra);
    const urlSet = s.compra && s.compra.url;
    if (urlSet || algumaMoeda) {
      h += '<div class="buy">' + (urlSet ? '<a class="btn" href="' + esc(urlSet) + '" target="_blank" rel="noopener sponsored">' + t("comprar") + '</a>' : '') + '<small>' + t("afiliado") + '</small></div>';
    } else if (s.compra) {
      h += '<div class="buy"><button class="btn" type="button" disabled>' + t("comprar") + '</button><small>' + t("afiliado_breve") + '</small></div>';
    }
  } else {
    h += '<div class="want"><div class="slots" aria-hidden="true"><i></i><i></i><i></i></div><div>' +
      '<p>' + t("falta_p", { pais: esc(nome) }) + '</p>' +
      '<button class="btn" id="ir-envie" type="button">' + t("como_mandar") + '</button></div></div>';
  }
  return h;
}

function desenharCartao() {
  const c = document.getElementById("card");
  if (!c) return;
  c.style.width = (CARTAO_MM * pxPorMm) + "px";
  c.style.height = (53.98 * pxPorMm) + "px";

let aberto = null;
let ultimoFoco = null;
function abrir(p) {
  const ov = document.getElementById("overlay");
  const pn = document.getElementById("panel");
  if (!ov.classList.contains("open")) ultimoFoco = document.activeElement;
  aberto = p;
  pn.innerHTML = painel(p);
  ov.classList.add("open");
  ov.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  desenharCartao();
  document.getElementById("fechar").focus();
}
function fechar(limparHash) {
  const ov = document.getElementById("overlay");
  if (!ov.classList.contains("open")) return;
  aberto = null;
  ov.classList.remove("open");
  ov.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  if (limparHash && location.hash) history.replaceState(null, "", location.pathname + location.search);
  if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
}

function mudarIdioma(id, salvar) {
  if (!T[id]) return;
  estado.lang = id;
  if (salvar) store.set("pdf-lang", id);
  textosFixos();
  chipsContinente();
  lista();
  ranking();
  apoie();
  if (aberto) { document.getElementById("panel").innerHTML = painel(aberto); desenharCartao(); }
}

/* Endereços aceitos: #japao, #en, #en-japao, #paises, #apoie, #envie, #ranking, #contato, #redes, #fale */
function rota() {
  let h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^(pt|en|es|zh|hi)(?:-(.+))?$/);
  if (m) { if (m[1] !== estado.lang) mudarIdioma(m[1], true); h = m[2] || ""; }
  const p = porSlug[h];
  if (p) { mostrarAba("paises"); abrir(p); return; }
  fechar(false);
  if (ABA_DE[h]) { mostrarAba(ABA_DE[h]); if (h !== ABA_DE[h]) { const el = document.getElementById(h); if (el) el.scrollIntoView(); } else window.scrollTo(0, 0); }
  else mostrarAba(abaAtual);
}

/* Rola até a seção sem animação (a rolagem animada falha em alguns visualizadores).
   Tenta pela janela; se a página não se mexeu, usa o scrollIntoView do próprio elemento. */
/* Cada endereço do site pertence a uma aba do menu. */
const ABA_DE = { paises: "paises", apoie: "apoie", envie: "envie", ranking: "ranking", contato: "contato", redes: "contato", fale: "contato" };
let abaAtual = "paises";
function mostrarAba(aba) {
  abaAtual = aba;
  document.querySelectorAll("[data-aba]").forEach(el => { el.hidden = el.dataset.aba !== aba; });
  document.querySelectorAll("[data-aba-link]").forEach(a => {
    if (a.dataset.abaLink === aba) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
function abrirAba(aba, alvo) {
  mostrarAba(aba);
  history.replaceState(null, "", "#" + (alvo && alvo !== aba ? alvo : aba));
  if (alvo && alvo !== aba && alvo !== "redes") irPara(alvo); else window.scrollTo(0, 0);
}

function irPara(id) {
  if (ABA_DE[id] && ABA_DE[id] !== abaAtual) { abrirAba(ABA_DE[id], id); return; }
  const el = document.getElementById(id);
  if (!el) return;
  const raiz = document.scrollingElement || document.documentElement;
  const y = id === "topo" ? 0 : Math.max(0, el.getBoundingClientRect().top + raiz.scrollTop);
  window.scrollTo(0, y);
  raiz.scrollTop = y;
  requestAnimationFrame(() => { if (Math.abs(el.getBoundingClientRect().top) > 4) el.scrollIntoView({ block: "start" }); });
}

function atualizarMoedas() {
  const box = document.getElementById("coins");
  if (aberto && aberto.set && box) box.innerHTML = linhaDoTempo(aberto.set.moedas);
  desenharCartao();
}

const MOSTRAR_NIVEIS = false;

    '<div class="forma"><h4>' + t("forma_din_t") + '</h4><p>' + t("forma_din") + '</p>' +

let abaRanking = "moedas";
function quem(c) {
  const p = c.pais && porId[c.pais];
  return '<span class="quem"><span class="nome">' + esc(c.nome) + '</span>' +
    (p ? '<span class="nac">' + bandeira(p, "mini") + ' ' + esc(nomePais(p)) + '</span>' : '') + '</span>';
}
const chave = s => String(s).trim().toLowerCase();
function acervoHTML() {
  const itens = [];
  PAISES.forEach(p => { if (!p.set) return; p.set.moedas.forEach(m => { if (m.origem === "ganhamos") itens.push({ p: p, m: m }); }); });
  if (!itens.length) return '<p class="rank-vazio">' + t("vazio_acervo") + '</p>';
  const loc = locale();
  itens.sort((a, b) => nomePais(a.p).localeCompare(nomePais(b.p), loc) || (a.m.ano - b.m.ano) || ((a.m.face || 0) - (b.m.face || 0)));
  return '<ol class="acervo"><li class="head"><span>' + t("col_num") + '</span><span>' + t("col_pais_un") + '</span><span>' + t("col_ano") + '</span><span>' + t("col_contrib") + '</span></li>' +
    itens.map((it, i) => {
      const pd = it.m.presenteDe || {};
      const nac = pd.pais && porId[pd.pais];
      const quemEnviou = pd.autorizou && pd.nome
        ? esc(pd.nome) + (nac ? ' <span class="nac" title="' + esc(nomePais(nac)) + '">' + bandeira(nac, "mini") + '</span>' : '')
        : '<span class="anon">' + t("anonimo") + '</span>';
      return '<li><span class="val">' + esc(tr(it.m.valor)) + '</span><span>' + bandeira(it.p, "mini") + ' ' + esc(nomePais(it.p)) + '</span><span class="n">' + it.m.ano + '</span><span>' + quemEnviou + '</span></li>';
    }).join("") + '</ol>';
}

function rankingHTML() {
  if (abaRanking === "acervo") return acervoHTML();
  const fmtR = v => { try { return new Intl.NumberFormat(locale(), { style: "currency", currency: "BRL" }).format(v); } catch (e) { return "R$ " + v; } };
  if (abaRanking === "dinheiro") {
    const por = {}; let anon = 0;
    DOACOES.forEach(d => {
      if (d.autorizou && d.nome) { const k = chave(d.nome); por[k] = por[k] || { nome: d.nome.trim(), total: 0 }; por[k].total += Number(d.valor) || 0; if (d.pais) por[k].pais = d.pais; }
      else anon += Number(d.valor) || 0;
    });
    const lista = Object.values(por).sort((a, b) => b.total - a.total);
    if (!lista.length && !anon) return '<p class="rank-vazio">' + t("vazio_dinheiro") + '</p>';
    return (lista.length ? '<ol class="rank"><li class="head dois"><span>#</span><span>' + t("col_nome") + '</span><span class="num">' + t("col_total") + '</span></li>' +
      lista.map((c, i) => '<li class="dois"><span class="pos">' + (i + 1) + '</span>' + quem(c) + '<span class="num">' + fmtR(c.total) + '</span></li>').join("") + '</ol>' : '') +
      (anon ? '<p class="rank-extra">' + t("anon_dinheiro", { v: fmtR(anon) }) + '</p>' : '');
  }
  const por = {}; let anon = 0;
  PAISES.forEach(p => { if (!p.set) return; p.set.moedas.forEach(m => {
    if (m.origem !== "ganhamos") return;
    const pd = m.presenteDe || {};
    if (pd.autorizou && pd.nome) { const k = chave(pd.nome); por[k] = por[k] || { nome: pd.nome.trim(), moedas: 0, paises: new Set() }; por[k].moedas++; por[k].paises.add(p.id); if (pd.pais) por[k].pais = pd.pais; }
    else anon++;
  }); });
  const lista = Object.values(por).sort((a, b) => (b.moedas - a.moedas) || (b.paises.size - a.paises.size));
  if (!lista.length && !anon) return '<p class="rank-vazio">' + t("vazio_moedas") + '</p>';
  return (lista.length ? '<ol class="rank"><li class="head"><span>#</span><span>' + t("col_nome") + '</span><span class="num">' + t("col_moedas") + '</span><span class="num">' + t("col_paises") + '</span></li>' +
    lista.map((c, i) => '<li><span class="pos">' + (i + 1) + '</span>' + quem(c) + '<span class="num">' + c.moedas + '</span><span class="num">' + c.paises.size + '</span></li>').join("") + '</ol>' : '') +
    (anon ? '<p class="rank-extra">' + t("anon_moedas", { q: qtd(anon) }) + '</p>' : '');
}
function ranking() {
  document.querySelectorAll("[data-tab]").forEach(b => { b.setAttribute("aria-selected", b.dataset.tab === abaRanking); b.tabIndex = b.dataset.tab === abaRanking ? 0 : -1; });
  const pn = document.getElementById("rank-painel");

/* No visualizador de artifacts, links de download não funcionam: lá o PDF é entregue pelo recurso "downloads".
   No GitHub Pages, claude.use não existe e o link normal baixa o arquivo. */
let baixar = null;
try { if (window.claude && claude.use) claude.use("downloads").then(d => { baixar = d; }, () => {}); } catch (err) {}
document.addEventListener("click", e => {
  const pdf = e.target.closest("[data-pdf]");
  if (pdf && baixar) {
    e.preventDefault();
    const href = pdf.getAttribute("href");
    fetch(href).then(r => r.blob()).then(b => baixar.save({ filename: href.split("/").pop(), data: b })).catch(() => {});
    return;
  }
  const fl = e.target.closest(".coin.flip");
  if (fl) { fl.classList.toggle("virada"); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { abaRanking = tb.dataset.tab; ranking(); return; }
  const lg = e.target.closest("[data-lang]");
  if (lg) { mudarIdioma(lg.dataset.lang, true); return; }
  const slot = e.target.closest(".slot");
  if (slot) { location.hash = slot.dataset.slug; return; }
  const st = e.target.closest("[data-st]");
  if (st) { estado.st = st.dataset.st; document.querySelectorAll("[data-st]").forEach(b => b.setAttribute("aria-pressed", b === st)); lista(); return; }
  const ct = e.target.closest("[data-cont]");
  if (ct) { estado.cont = ct.dataset.cont; document.querySelectorAll("[data-cont]").forEach(b => b.setAttribute("aria-pressed", b === ct)); lista(); return; }
  const al = e.target.closest("[data-aba-link]");
  if (al) { e.preventDefault(); abrirAba(al.dataset.abaLink); return; }
  const sc = e.target.closest("[data-scroll]");
  if (sc) { e.preventDefault(); irPara(sc.dataset.scroll); return; }
  if (e.target.id === "fechar" || e.target.id === "overlay") { fechar(true); return; }
  if (e.target.id === "ir-envie") { fechar(true); abrirAba("envie"); return; }
  if (e.target.id === "abrir-calib") { document.getElementById("calib").classList.toggle("open"); desenharCartao(); return; }
  if (e.target.id === "reset-calib") { pxPorMm = 96 / 25.4; store.set("pdf-pxmm", pxPorMm); atualizarMoedas(); document.getElementById("escala").value = pxPorMm; return; }
  if (e.target.id === "copy-pix") {
    const ok = () => { document.getElementById("pix-ok").textContent = t("copiado"); };
    const falha = () => { document.getElementById("pix-ok").textContent = t("copiar_falha"); };
    try { navigator.clipboard.writeText(APOIO.pix).then(ok, falha); } catch (err) { falha(); }
    return;
  }
  if (e.target.id === "copy-addr") {
    const txt = ENDERECO.join("\n");
    const ok = () => { document.getElementById("copied").textContent = t("copiado"); };
    const falha = () => { document.getElementById("copied").textContent = t("copiar_falha"); };
    try { navigator.clipboard.writeText(txt).then(ok, falha); } catch (err) { falha(); }
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "q") { estado.q = e.target.value; lista(); }
  if (e.target.id === "escala") { pxPorMm = parseFloat(e.target.value); store.set("pdf-pxmm", pxPorMm); atualizarMoedas(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") fechar(true);
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".coin.flip")) { e.preventDefault(); e.target.classList.toggle("virada"); }
  if (e.target.matches && e.target.matches("[data-tab]") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const abas = ["moedas", "acervo", "dinheiro"];
    abaRanking = abas[(abas.indexOf(abaRanking) + (e.key === "ArrowRight" ? 1 : 2)) % 3]; ranking(); document.getElementById("tab-" + abaRanking).focus();
  }
});
window.addEventListener("hashchange", rota);

document.getElementById("endereco").innerHTML = ENDERECO.map(esc).join("<br>");
textosFixos();
contagem();
chipsContinente();
lista();
ranking();
apoie();
rota();
</script>
</body>
</html>
